# 云端编译并发布 Android APK（默认启用固定签名 + --side 并存构建，可与上游官方版共存且后续直接覆盖升级）。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Android ABI flavor'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x64
          - all
      side:
        description: 'Side-by-side build (package .test, coexists with upstream DSH Go)'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Custom release tag (leave empty for auto)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai
  DSH_MAVEN_MIRRORS: 0

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore runtime download cache
        id: cache-rt-dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Restore built runtime bundle cache
        id: cache-rt-out
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out
          key: runtime-out-v1-${{ inputs.flavor || 'arm64' }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/patches/**', 'runtime/boot/**', 'runtime/bridge/**', 'runtime/direct/**', 'runtime/lib/**') }}

      - name: Build bundled Linux runtime if needed
        run: |
          flavor="${{ inputs.flavor || 'arm64' }}"
          need=()
          if [ "$flavor" = "arm64" ] || [ "$flavor" = "all" ]; then
            if ! python3 -I tooling/check_runtime_bundle.py arm64 >/dev/null 2>&1; then
              need+=(arm64-v8a)
            fi
          fi
          if [ "$flavor" = "x64" ] || [ "$flavor" = "all" ]; then
            if ! python3 -I tooling/check_runtime_bundle.py x64 >/dev/null 2>&1; then
              need+=(x86_64)
            fi
          fi
          for abi in "${need[@]}"; do
            runtime/build-runtime.sh "$abi"
          done
          if [ "$flavor" = "all" ]; then
            python3 -I tooling/check_runtime_bundle.py arm64 x64
          else
            python3 -I tooling/check_runtime_bundle.py "$flavor"
          fi

      - name: Save runtime caches
        if: steps.cache-rt-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache-rt-dl.outputs.cache-primary-key }}

      - name: Save built runtime bundle cache
        if: steps.cache-rt-out.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out
          key: ${{ steps.cache-rt-out.outputs.cache-primary-key }}

      - name: Ensure Android NDK for tawcroot
        run: |
          ndk_version=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          echo "Required NDK: ${ndk_version}"
          ndk_dir="${ANDROID_HOME}/ndk/${ndk_version}"
          if [ ! -d "$ndk_dir" ]; then
            sdkmgr=$(command -v sdkmanager || ls -1d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
            test -n "$sdkmgr" || { echo "sdkmanager not found under ${ANDROID_HOME}" >&2; exit 1; }
            yes | "$sdkmgr" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
            yes | "$sdkmgr" --sdk_root="${ANDROID_HOME}" "ndk;${ndk_version}"
          fi
          test -d "$ndk_dir"
          {
            echo "ANDROID_NDK_HOME=${ndk_dir}"
            echo "ANDROID_NDK_ROOT=${ndk_dir}"
          } >> "$GITHUB_ENV"

      - name: Configure fixed release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set; falling back to ephemeral debug signing"
            exit 0
          fi
          ks_path="${RUNNER_TEMP}/dsh-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks_path"
          chmod 600 "$ks_path"
          {
            printf 'storeFile=%s\n' "$ks_path"
            printf 'storePassword=%s\n' "$KEYSTORE_PWD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PWD"
          } > app/android/key.properties
          chmod 600 app/android/key.properties
          echo "Configured fixed release signing keystore."

      - name: Prepare Flutter dependencies and Gradle wrapper
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
          if [ ! -x android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version "${GRADLE_VERSION}")
          fi

      - name: Build Android Release APK
        run: |
          flags=(-f "${{ inputs.flavor || 'arm64' }}" --release --no-companion --no-star)
          if [ "${{ inputs.side }}" != "false" ]; then
            flags+=(--side)
          fi
          bash tooling/build-apk.sh "${flags[@]}"

      - name: Package release assets and verify signature
        id: pkg
        run: |
          flavor="${{ inputs.flavor || 'arm64' }}"
          is_side="${{ inputs.side != 'false' }}"
          short_sha=$(git rev-parse --short HEAD)

          args=()
          if [ "$flavor" = "all" ]; then
            args+=("arm64=app/build/app/outputs/flutter-apk/app-arm64-release.apk")
            args+=("x64=app/build/app/outputs/flutter-apk/app-x64-release.apk")
          else
            args+=("${flavor}=app/build/app/outputs/flutter-apk/app-${flavor}-release.apk")
          fi

          # 读取并打印签名证书 SHA-256 指纹（无私钥泄露）
          apksigner=$(ls -1d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          cert_sha256="unknown"
          first_apk="${args[0]#*=}"
          if [ -n "$apksigner" ] && [ -f "$first_apk" ]; then
            cert_info=$("$apksigner" verify --print-certs "$first_apk" || true)
            echo "$cert_info"
            cert_sha256=$(printf '%s\n' "$cert_info" | sed -n 's/.*SHA-256 digest: //p' | head -n 1)
          fi

          if [ "$is_side" = "true" ]; then
            mode_desc="并存版（包名 \`io.github.ccch1mneyyy.dsh_app.test\`，桌面名称 **DSH Go 测试**，可与上游官方版共存）"
          else
            mode_desc="标准包名版（包名 \`io.github.ccch1mneyyy.dsh_app\`）"
          fi

          cat > release-notes.md <<EOF
          DSH Go Android 构建产物（commit \`${short_sha}\`）。

          - **安装形态**：${mode_desc}
          - **固定签名证书 SHA-256**：\`${cert_sha256}\`（后续版本均使用同一固定密钥签名，可直接保留数据覆盖升级）
          - **核心特性**：包含上游同步、宽屏工作台 UI 对齐与 PC 端多 CLI（Antigravity / Claude Code / Codex）桥接支持
          EOF

          python3 tooling/release_assets.py --delta-from 0 --notes release-notes.md "${args[@]}"

          ver_full=$(python3 -c 'import json; print(json.load(open("dist/update.json"))["version"])')
          ver_name="${ver_full%+*}"
          ver_code="${ver_full#*+}"
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            if [ "$is_side" = "true" ]; then
              tag="v${ver_name}-${ver_code}-side"
            else
              tag="v${ver_name}-${ver_code}"
            fi
          fi

          if [ "$is_side" = "true" ]; then
            title="DSH Go 测试 ${ver_full}（固定签名·并存版）"
          else
            title="DSH Go ${ver_full}（固定签名）"
          fi

          python3 - "$tag" "$title" "$GITHUB_REPOSITORY" "$is_side" <<'PY'
          import json, pathlib, sys
          tag, title, repo, is_side = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4] == "true"
          dist = pathlib.Path("dist")
          data = json.loads((dist / "update.json").read_text(encoding="utf-8"))
          if is_side:
            new_assets = {}
            sums = []
            for flavor, entry in data["assets"].items():
              old_name = entry["name"]
              new_name = old_name.replace(f"-{flavor}.apk", f"-side-{flavor}.apk")
              if (dist / old_name).exists() and new_name != old_name:
                (dist / old_name).rename(dist / new_name)
              entry["name"] = new_name
              new_assets[flavor] = entry
              sums.append(f"{entry['sha256']}  {new_name}")
            data["assets"] = new_assets
            (dist / "SHA256SUMS").write_text("\n".join(sums) + "\n", encoding="utf-8", newline="\n")
          data["tag"] = tag
          data["title"] = title
          data["page"] = f"https://github.com/{repo}/releases/tag/{tag}"
          (dist / "update.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY

          echo "version_full=${ver_full}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/dsh-release.jks" app/android/key.properties

      - name: Upload APK workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk-${{ steps.pkg.outputs.version_full }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.pkg.outputs.tag }}"
          title="${{ steps.pkg.outputs.title }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file release-notes.md
          fi
